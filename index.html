<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Book &amp; Course Search</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --badge-bg: #f1f5f9;
      --badge-text: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 36px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 20px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.98rem;
      color: var(--text);
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .results-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.2s, transform 0.15s;
    }

    .result-item:hover {
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .item-title {
      font-weight: 600;
      font-size: 0.96rem;
    }

    .item-category {
      flex-shrink: 0;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--badge-text);
      background: var(--badge-bg);
      border-radius: 999px;
    }

    .empty-state {
      text-align: center;
      padding: 24px 14px;
      color: var(--muted);
      background: #f8fafc;
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Library &amp; Course Search</h1>
    <p class="subtitle">Real-time client-side filtering using safe DOM node creation.</p>

    <label for="search-input">Search by title or category</label>
    <input
      id="search-input"
      class="search-input"
      type="search"
      placeholder="e.g., Security, JavaScript, Database..."
      autocomplete="off"
    />

    <div class="meta-bar">
      <span id="result-count"></span>
      <span>Safe mode: <code>textContent</code></span>
    </div>

    <ul id="results-list" class="results-list"></ul>
  </main>

  <script>
    const catalog = [
      { title: "Web Application Security Fundamentals", category: "Security" },
      { title: "Modern JavaScript & DOM Patterns", category: "Frontend" },
      { title: "Relational Database Design", category: "Database" },
      { title: "HTTP & REST API Architecture", category: "Backend" },
      { title: "OWASP Top 10 Practical Guide", category: "Security" },
      { title: "Git & Collaborative Workflows", category: "Tooling" }
    ];

    const searchInput = document.getElementById("search-input");
    const resultsList = document.getElementById("results-list");
    const resultCount = document.getElementById("result-count");

    function updateCountText(count, total) {
      resultCount.textContent = `Showing ${count} of ${total} items`;
    }

    function renderResults(filteredItems) {
      resultsList.replaceChildren();
      updateCountText(filteredItems.length, catalog.length);

      if (filteredItems.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "empty-state";
        emptyItem.textContent = "No matching items found.";
        resultsList.appendChild(emptyItem);
        return;
      }

      const fragment = document.createDocumentFragment();

      filteredItems.forEach((item) => {
        const listItem = document.createElement("li");
        listItem.className = "result-item";

        const titleSpan = document.createElement("span");
        titleSpan.className = "item-title";
        titleSpan.textContent = item.title;

        const categorySpan = document.createElement("span");
        categorySpan.className = "item-category";
        categorySpan.textContent = item.category;

        listItem.appendChild(titleSpan);
        listItem.appendChild(categorySpan);
        fragment.appendChild(listItem);
      });

      resultsList.appendChild(fragment);
    }

    searchInput.addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();

      const filtered = catalog.filter((item) => {
        const matchesTitle = item.title.toLowerCase().includes(query);
        const matchesCategory = item.category.toLowerCase().includes(query);
        return matchesTitle || matchesCategory;
      });

      renderResults(filtered);
    });

    renderResults(catalog);
  </script>
</body>
</html>
